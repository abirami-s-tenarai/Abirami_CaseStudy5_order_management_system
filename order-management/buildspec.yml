version: 0.2

phases:
  install:
    commands:
      - go version

  pre_build:
    commands:
      - cd order-management && go mod download

  build:
    commands:
      - cd order-management && go build ./...

  post_build:
    commands:
      - cd order-management && go test ./...
      - cd order-management && go vet ./...
      - echo "Build completed successfully."