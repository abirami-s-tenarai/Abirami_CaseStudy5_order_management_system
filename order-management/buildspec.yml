version: 0.2

phases:
  install:
    commands:
      - go version

  pre_build:
    commands:
      - echo "Downloading Go dependencies..."
      - go mod download

  build:
    commands:
      - echo "Building Go application..."
      - go build ./...

  post_build:
    commands:
      - echo "Running tests..."
      - go test ./...
      - echo "Running Go vet..."
      - go vet ./...
      - echo "Build completed successfully."